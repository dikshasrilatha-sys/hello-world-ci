
name: Hello World CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display start message
        run: echo "Starting Build Job"

      - name: Check shell syntax
        run: bash -n hello.sh

      - name: Display script information
        run: ls -l hello.sh

      - name: Execute Hello World script
        run: bash hello.sh

      - name: Build completion message
        run: echo "Build job completed successfully!"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Hello World output
        run: |
          output=$(bash hello.sh)
          if [ "$output" = "Hello, world!" ]; then
            echo "Test passed!"
          else
            echo "Test failed!"
            exit 1
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deployment simulation
        run: echo "Deploy simulation completed successfully!"

